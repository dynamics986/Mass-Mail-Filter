name: Update CUHK digest data
on:
  schedule:
    # Hong Kong time: Thursday and Saturday at 13:15.
    - cron: "15 5 * * 4,6"
    # Hong Kong time: Friday at 13:15, 15:15, and 18:15.
    - cron: "15 5,7,10 * * 5"
  workflow_dispatch:
    inputs:
      digest_date:
        description: "Optional digest date (YYYYMMDD)"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: update-cuhk-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test parser and rules
        run: python -m pytest -q tests
      - name: Fetch and validate public digest
        run: |
          if [ -n "${{ inputs.digest_date }}" ]; then
            python -m scraper.main --date "${{ inputs.digest_date }}"
          else
            python -m scraper.main
          fi
      - name: Commit only when the feed changed
        run: |
          if git diff --quiet -- public/data; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: update CUHK digest"
          git push
